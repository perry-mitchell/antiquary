name: Test

on: pull_request

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: antiquary
          POSTGRES_PASSWORD: antiquary
          POSTGRES_DB: antiquary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antiquary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
